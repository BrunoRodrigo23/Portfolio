<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Blog</title>

  <style>
    body {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header div a {
      text-decoration: none;/* tira o sublinhado */
      color: rgb(138, 222, 228);
    }

    article {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    h2 {
      color: #1E90FF;
    }

    .navegacao {
      display: flex;
      justify-content: space-between;
    }

    .navegacao a {
      text-decoration: none;
    }

    .topo {
      padding: 8px 15px 20px 15px;
      background-color: rgb(138, 222, 228);
      font-size: 30px;
    }

    .logo {
      color: black;
      cursor: pointer;
      width: max-content;
      overflow: hidden;
    }

    .logo:hover {
      color: #ffffff;
    }

    .blog {
      color: black;
      border-radius: 15px;
      cursor: pointer;
      width: max-content;
      overflow: hidden;
    }

    .blog:hover {
      color: #ffffff;
    }

    .listaDeNavegacao {
      color: black;
      border-radius: 15px;
      cursor: pointer;
      width: max-content;
      overflow: hidden;
    }

    .listaDeNavegacao:hover {
      color: #ffffff;
    }

  </style>

</head>

<body>

  <header>

    <div class="topo">
      <nav class="navegacao">
        <a href="index.html"><i class="logo">Bruno Rodrigo</i></a>
        <div>
          <a href="index.html"><i class="listaDeNavegacao">Home</i></a>
          <a href="blog.html"><i class="blog">Blog</i></a>
        </div>
      </nav>
    </div>

    <h1>Bem-vindo ao meu Blog</h1>
    <p>Escrevendo sobre minha evolução na programação 🚀</p>
  </header>

  <article>
    <h2>Primeiro Post</h2>
    <p>já está funcionando!</p>
  </article>

  <article>
    <h2>Segundo Post</h2>
    <p>Eu odeio HTML e CSS.</p>
  </article>

</body>

</html>
